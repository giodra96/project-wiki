name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install helper dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check schema contract drift
        run: python scripts/check_contracts.py

      - name: Compile Python sources
        run: python -m py_compile scripts/check_contracts.py scripts/check_inbox.py scripts/ingest_document.py scripts/review_progress.py scripts/schema_contract.py scripts/validate_wiki.py tests/test_check_inbox.py tests/test_ingest_document.py tests/test_ingest_document_units.py tests/test_review_progress.py tests/test_schema_contract.py tests/test_validate_wiki.py tests/wiki_fixtures.py

      - name: Smoke test helper CLIs
        run: |
          python scripts/check_contracts.py --help
          python scripts/check_inbox.py --help
          python scripts/ingest_document.py --help
          python scripts/review_progress.py --help
          python scripts/validate_wiki.py --help