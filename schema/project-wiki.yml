    - in-progress
    - complete
  entry_statuses:
    - pending
    - reviewed
    - classified
    - skipped
  complete_entry_statuses:
    - classified
    - skipped
  classifications:
    - requirement
    - requirement-refinement
    - change-request
    - decision
    - technical-documentation
    - work-item
    - open-question
    - conflict

