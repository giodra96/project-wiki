      type: project
      title: Project Overview
      tags: [project]
      message: No project-specific identity or goals have been captured yet.
    GLOSSARY.md:
      recipe: placeholder-document
      id: GLOSSARY
      type: note
      title: Glossary
      tags: [glossary]
      message: No project-specific terms have been captured yet.
    requirements/INDEX.md:
      recipe: section-index
      title: Requirements
      description: This section stores explicit product intent, constraints, and open questions.
      when_to_read:
        - Understand confirmed project behavior, scope, constraints, or unresolved product intent.
      key_files:
        - '[Product brief](./product-brief.md)'
        - '[Functional requirements](./functional/INDEX.md)'
        - '[Non-functional requirements](./non-functional/INDEX.md)'
        - '[Constraints](./constraints.md)'
        - '[Open questions](./open-questions.md)'
