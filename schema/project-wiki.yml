      - 'Current project wiki schema version: `{schema_version}`'
    README.md:
      - 'Wiki schema {schema_version}'
      - 'wiki_schema-{schema_version}-'
    SECURITY.md:
      - '`{schema_minor}.x` (Current)'
      - '`< {schema_version}`'
    assets/core-templates.md:
