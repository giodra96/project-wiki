  intake_date_format: '%Y%m%d'
  intake_sequence_width: 3
  intake_chunk_label: CH
  intake_chunk_sequence_width: 3

source_workflow:
  processable_statuses:
    - pending
    - failed
  terminal_statuses:
    - processed
    - rejected
    - ignored
    - superseded
  status_priority:
    - processed
    - ignored
    - rejected
    - superseded
    - pending
    - failed
  reason_actions:
    new-unique: process
    registered-pending: process
    registered-failed: process
    inbox-duplicate: skip
    registered-processed: skip
    registered-rejected: skip
    registered-ignored: skip
    registered-superseded: skip
    intake-history-match: skip
    historical-path-with-new-content: review
    ambiguous-processable-history: review

