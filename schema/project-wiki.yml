  generic: '[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)*'
  project: 'PROJECT'
  note: '[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)*'
  technical: 'TECH-[A-Z0-9]+(?:-[A-Z0-9]+)*'
  requirement: 'REQ-\d{3}'
  non-functional-requirement: 'NFR-\d{3}'
  requirements-topic: 'REQ-TOPIC-\d{8}-\d{3}'
  constraint: 'CON-\d{3}'
  open-question: 'OQ-\d{3}'
  change-request: 'CR-\d{8}-\d{3}'
  decision: 'ADR-\d{4}'
  module: 'MOD-\d{3}'
  api: 'API-\d{3}'
  data: 'DATA-\d{3}'
  integration: 'INT-\d{3}'
  analysis: 'AN-\d{8}-\d{3}'
  alert: 'ALERT-\d{8}-\d{3}'
  intake-document: 'DOCIN-\d{8}-\d{3}'
  intake-chunk: 'DOCIN-\d{8}-\d{3}-CH-\d{3}'
  intake-review: 'DOCIN-\d{8}-\d{3}-REVIEW'
  intake-extraction-index: 'DOCIN-\d{8}-\d{3}-EXTRACTED'
  source-record: 'SRC-\d{8}-\d{3}'
  work-item: 'WI-\d{8}-\d{3}'
  scan-report: 'SCAN-\d{8}'
  sync-report: 'SYNC-\d{8}-\d{3}'
  maintenance-lint: 'LINT-\d{8}'
  schema-migration: 'MIGRATION-\d{8}'
  wiki-log: 'WLOG-\d{8}-\d{3}'

