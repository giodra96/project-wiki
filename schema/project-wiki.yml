frontmatter:
  required_fields:
    - id
    - type
    - status
    - title
    - created
    - updated
    - tags
    - related
    - source_paths
    - confidence
  exempt_paths:
    - STATUS.md
    - changes/CHANGELOG.md
    - traceability/requirement-map.md
    - traceability/change-impact-map.md
    - traceability/code-map.md

statuses:
  default:
    - active
    - draft
    - placeholder
    - superseded
    - deprecated
    - blocked
    - resolved
  alert:
    - open
    - resolved
    - dismissed
    - accepted-risk
  open-question:
    - open
    - partially-resolved
    - resolved
    - superseded
    - dismissed
    - duplicate
  intake:
    - active
    - reviewed
    - integrated
    - archived
    - superseded
    - rejected
  source:
    - pending
    - processed
    - failed
    - rejected
    - ignored
    - superseded

confidence_values:
  - confirmed
  - inferred
  - unknown

alert_severities:
  - critical
  - high
  - medium
  - low

